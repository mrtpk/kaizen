<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="914" viewBox="0 0 1100 914">
<defs></defs>
<rect width="1100" height="914" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Why the padding must be the zero point</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Int8 on Silicon  ·  part 2  ·  5x5 input  ·  3x3 conv with SAME padding  ·  z_in = -64</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">folded bias = bias - z_in * sum(all 9 weights): it assumes every point of the window holds z_in</text>
<rect x="20.0" y="116.0" width="1060.0" height="190.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="142.0" r="13" fill="#111827"/>
<text x="46.0" y="146.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="147.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What if we pad with z_in?</text>
<text x="68.0" y="166.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Each padded point adds z_in * w, and the folded bias removes exactly that. The corner is exact.</text>
<rect x="80.0" y="182.0" width="36.0" height="36.0" rx="4" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.2"/>
