<text x="250.0" y="212.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">padded points hold -64 = real 0.0</text>
<text x="250.0" y="236.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">MAC adds  -64 * (sum of the 5 padded weights) = -64 * -40 = 2560</text>
<text x="250.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">folded bias removes the same 2560</text>
<text x="250.0" y="284.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">corner output = reference  (-50248)</text>
<rect x="20.0" y="326.0" width="1060.0" height="190.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
