<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">LiDAR Road Detection  ·  part 3  ·  the network of Caltagirone et al., shapes as width x height x maps</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">input 200 x 400 x 6  ·  one 2 x 2 max pooling  ·  context at 100 x 200  ·  output 200 x 400 x 2</text>
<rect x="20.0" y="116.0" width="1060.0" height="206.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
