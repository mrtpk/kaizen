<text x="30.0" y="446.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">A 3x3 convolution from a to b maps has 9ab weights and b biases. The paper does not give a total.</text>
