<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs>
<rect width="1100" height="694" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Quantizing a float to int8</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Quantization Basics  ·  float range [-1, 3]  ·  signed int8 range [-128, 127]</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">scale = 0.015686    zero_point = -64</text>
<rect x="20.0" y="116.0" width="1060.0" height="300.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="142.0" r="13" fill="#111827"/>
<text x="46.0" y="146.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="147.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Where does each float land on the int8 line?</text>
<text x="68.0" y="166.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Divide by scale, add zero_point, round, then clip to [-128, 127].</text>
<line x1="200.0" y1="236.0" x2="1020.0" y2="236.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="241.0" y1="230.0" x2="241.0" y2="242.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="241.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">-1</text>
<line x1="405.0" y1="230.0" x2="405.0" y2="242.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="405.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">0</text>
<line x1="569.0" y1="230.0" x2="569.0" y2="242.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="569.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<line x1="733.0" y1="230.0" x2="733.0" y2="242.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="733.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<line x1="897.0" y1="230.0" x2="897.0" y2="242.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="897.0" y="260.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text>
<text x="186.0" y="241.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="end" xml:space="preserve" style="white-space:pre">float</text>
<line x1="240.4" y1="366.0" x2="896.4" y2="366.0" stroke="#059669" stroke-width="2"/>
<text x="186.0" y="371.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="end" xml:space="preserve" style="white-space:pre">int8</text>
<line x1="240.4" y1="360.0" x2="240.4" y2="372.0" stroke="#059669" stroke-width="1.4"/>
<text x="240.4" y="390.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">-128</text>
<line x1="405.0" y1="360.0" x2="405.0" y2="372.0" stroke="#059669" stroke-width="1.4"/>
<text x="405.0" y="390.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">-64</text>
<line x1="569.6" y1="360.0" x2="569.6" y2="372.0" stroke="#059669" stroke-width="1.4"/>
<text x="569.6" y="390.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">0</text>
<line x1="734.3" y1="360.0" x2="734.3" y2="372.0" stroke="#059669" stroke-width="1.4"/>
<text x="734.3" y="390.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">64</text>
<line x1="896.4" y1="360.0" x2="896.4" y2="372.0" stroke="#059669" stroke-width="1.4"/>
<text x="896.4" y="390.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">127</text>
<circle cx="241.0" cy="236.0" r="6" fill="#2563eb"/>
<text x="241.0" y="220.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">-1</text>
<line x1="241.0" y1="264.0" x2="240.4" y2="356.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m0)"/>
<circle cx="240.4" cy="366.0" r="6" fill="#059669"/>
<circle cx="405.0" cy="236.0" r="6" fill="#d97706"/>
<text x="405.0" y="220.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">0</text>
<line x1="405.0" y1="264.0" x2="405.0" y2="356.0" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m1)"/>
<circle cx="405.0" cy="366.0" r="6" fill="#059669"/>
<circle cx="569.0" cy="236.0" r="6" fill="#2563eb"/>
<text x="569.0" y="220.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<line x1="569.0" y1="264.0" x2="569.6" y2="356.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m0)"/>
<circle cx="569.6" cy="366.0" r="6" fill="#059669"/>
<circle cx="897.0" cy="236.0" r="6" fill="#2563eb"/>
<text x="897.0" y="220.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text>
<line x1="897.0" y1="264.0" x2="896.4" y2="356.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m0)"/>
<circle cx="896.4" cy="366.0" r="6" fill="#059669"/>
<text x="415.0" y="308.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">zero_point = -64</text>
<circle cx="979.0" cy="236.0" r="6" fill="#db2777"/>
<text x="979.0" y="220.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#db2777" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">3.5</text>
<path d="M 979.0,246 L 979.0,366 L 906.4,366" fill="none" stroke="#db2777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m2)"/>
<text x="987.0" y="306.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#db2777" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">clipped</text>
<rect x="20.0" y="436.0" width="1060.0" height="170.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="462.0" r="13" fill="#111827"/>
<text x="46.0" y="466.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="467.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Which formulas give these numbers?</text>
<text x="68.0" y="486.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Two parameters from the range, then one formula each way.</text>
<text x="68.0" y="518.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">scale      = (r_max - r_min) / (127 - (-128))   = 4 / 255             = 0.015686</text>
<text x="68.0" y="540.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">zero_point = round(-128 - r_min / scale)         = round(-64.25)       = -64</text>
<text x="68.0" y="562.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">quantize   q = clip(round(r / scale) + zero_point, -128, 127)</text>
<text x="68.0" y="584.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">dequantize r = scale * (q - zero_point)</text>
<text x="30.0" y="637.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="626.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="118.3" y="637.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">float value</text>
<rect x="206.0" y="626.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="227.0" y="637.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">int8 value</text>
<rect x="309.7" y="626.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="330.7" y="637.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">zero point (float 0.0)</text>
<rect x="477.1" y="626.0" width="14.0" height="14.0" rx="3" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.4"/>
<text x="498.1" y="637.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">clipped</text>
<text x="30.0" y="666.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Rounding zero_point moves the int8 line by a quarter step, so -1.0 and 3.0 come back as -1.0039 and 2.9961.</text>
</svg>
