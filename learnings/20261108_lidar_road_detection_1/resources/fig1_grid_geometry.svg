<line x1="114.0" y1="276.0" x2="120.0" y2="276.0" stroke="#111827" stroke-width="1"/>
<text x="110.0" y="280.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">36 m</text>
<line x1="114.0" y1="356.0" x2="120.0" y2="356.0" stroke="#111827" stroke-width="1"/>
<text x="110.0" y="360.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">26 m</text>
<line x1="114.0" y1="436.0" x2="120.0" y2="436.0" stroke="#111827" stroke-width="1"/>
<text x="110.0" y="440.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">16 m</text>
<line x1="114.0" y1="516.0" x2="120.0" y2="516.0" stroke="#111827" stroke-width="1"/>
<text x="110.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">6 m</text>
<text x="120.0" y="188.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">+10 m</text>
<text x="280.0" y="188.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">-10 m</text>
<rect x="188.0" y="560.0" width="24.0" height="36.0" rx="4" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="222.0" y="582.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">LiDAR (x = 0)</text>
<line x1="200.0" y1="516.0" x2="200.0" y2="560.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="178.2" cy="228.4" r="5" fill="#059669"/>
<line x1="178.2" y1="228.4" x2="294.0" y2="228.4" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
<text x="300.0" y="232.4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">point x=41.95, y=2.72</text>
<text x="560.0" y="216.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Axes (LiDAR frame)</text>
<text x="560.0" y="242.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">x: forward, the distance ahead</text>
<text x="560.0" y="264.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">y: to the left</text>
<text x="560.0" y="286.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">z: up (the elevation)</text>
<text x="560.0" y="308.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre"></text>
<text x="560.0" y="330.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">rows: 40 m / 0.1 m = 400</text>
<text x="560.0" y="352.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">cols: 20 m / 0.1 m = 200</text>
<text x="560.0" y="374.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre"></text>
<text x="560.0" y="396.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Only the points inside the box are used.</text>
<rect x="20.0" y="656.0" width="1060.0" height="170.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="682.0" r="13" fill="#111827"/>
<text x="46.0" y="686.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="687.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">How does a point find its cell?</text>
<text x="68.0" y="706.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Two floors, one per axis. Far rows and left columns come first.</text>
<rect x="60.0" y="730.0" width="300.0" height="78.0" rx="8" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5"/>
<text x="210.0" y="750.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">point</text>
<text x="210.0" y="768.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">x = 41.95 m</text>
<text x="210.0" y="783.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">y = 2.72 m</text>
<line x1="360.0" y1="769.0" x2="398.0" y2="769.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="400.0" y="730.0" width="300.0" height="78.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="550.0" y="750.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">row = floor((46 - x) / 0.1)</text>
<text x="550.0" y="768.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">floor(4.05 / 0.1)</text>
<text x="550.0" y="783.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">= 40</text>
<line x1="700.0" y1="769.0" x2="738.0" y2="769.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="740.0" y="730.0" width="300.0" height="78.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="890.0" y="750.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">col = floor((10 - y) / 0.1)</text>
<text x="890.0" y="768.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">floor(7.28 / 0.1)</text>
<text x="890.0" y="783.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">= 72</text>
<text x="30.0" y="857.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="846.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="118.3" y="857.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">grid</text>
<rect x="167.0" y="846.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="188.0" y="857.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">a point of the scan</text>
<rect x="321.1" y="846.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="342.1" y="857.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">the sensor</text>
<text x="30.0" y="886.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Drawn to scale, 8 px per metre. The example is the first in-grid point of the sample scan.</text>
</svg>
