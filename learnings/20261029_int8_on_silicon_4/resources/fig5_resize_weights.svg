<text x="30.0" y="708.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">TFLite builds the weights from integer coordinates as (1024 - f) and f, so the four products sum to exactly 1024 * 1024 = 2^20.</text>
