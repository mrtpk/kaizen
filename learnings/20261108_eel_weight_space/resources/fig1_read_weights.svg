<text x="30.0" y="600.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Eel length = longest side of the label polygon, in 640 x 360 frame pixels. Confidence 0.25, input 512 px.</text>
