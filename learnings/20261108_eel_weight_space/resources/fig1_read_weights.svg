<text x="250.0" y="450.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">100-150 px (163 eels)</text>
<rect x="260.0" y="437.0" width="518.8" height="18.0" rx="3" fill="#2563eb" fill-opacity="1.0" stroke="none"/>
<text x="786.8" y="450.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">92.6 %</text>
<text x="250.0" y="476.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">150-250 px (491 eels)</text>
