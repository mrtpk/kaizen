<text x="165.0" y="410.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">stride 16, 3 x 3 window</text>
<line x1="260.0" y1="495.0" x2="320.0" y2="495.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="340.0" y="440.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">keep = logit &gt;= max of its 3 x 3 window</text>
<text x="340.0" y="462.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  and &gt;= the 3 x 3 max of the coarser scale (upsampled)</text>
<text x="340.0" y="484.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  and &gt;= the 3 x 3 max of the finer scale (pooled 2 x 2)</text>
<text x="340.0" y="506.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">others: logit - 20  (score ~ 0)</text>
<text x="340.0" y="540.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">duplicates 329 -&gt; 1   mislocalized 73 -&gt; 58   true positives 4613 -&gt; 4611</text>
