<text x="250.0" y="259.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">mislocalized</text>
<rect x="260.0" y="246.0" width="153.3" height="18.0" rx="3" fill="#d97706" fill-opacity="1.0" stroke="none"/>
<text x="421.3" y="259.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">73  (62 on missed eels)</text>
<text x="250.0" y="285.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">background</text>
<rect x="260.0" y="272.0" width="2.1" height="18.0" rx="3" fill="#9ca3af" fill-opacity="1.0" stroke="none"/>
