<rect x="413.7" y="610.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="434.7" y="621.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">window</text>
<text x="30.0" y="650.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">A duplicate scores about 2/3 of its true positive, so a higher confidence threshold removes true eels first.</text>
<text x="30.0" y="668.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The rule is CenterNet&#x27;s local-maximum trick applied to the YOLO26 one-to-one head, plus the cross-scale check.</text>
</svg>
