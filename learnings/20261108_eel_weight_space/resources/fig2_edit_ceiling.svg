<text x="30.0" y="634.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The probe is a class-weighted logistic regression on the 64 stride-8 features: a measurement, not an edit to keep.</text>
