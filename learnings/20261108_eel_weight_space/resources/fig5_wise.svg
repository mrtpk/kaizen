<text x="30.0" y="646.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Bars start at 1.34. Fitness = box and mask, 0.1 x mAP50 + 0.9 x mAP50-95. alpha was chosen on the same half it is scored on.</text>
</svg>
