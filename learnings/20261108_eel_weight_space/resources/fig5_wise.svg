<text x="200.0" y="537.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">class branches only</text>
<rect x="210.0" y="524.0" width="239.7" height="18.0" rx="3" fill="#db2777" fill-opacity="1.0" stroke="none"/>
<text x="457.7" y="537.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">1.3836   R 0.938   box mAP50-95 0.768</text>
<text x="200.0" y="563.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">head-only fine-tune</text>
