<text x="30.0" y="532.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Multiply: each input pass uses 2^10, so the product of the two lands at 2^20.</text>
