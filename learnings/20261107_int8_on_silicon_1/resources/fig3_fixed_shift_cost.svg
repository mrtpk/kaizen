<text x="400.0" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">10485</text>
<text x="600.0" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">14</text>
<text x="800.0" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">-0.007 %</text>
<text x="80.0" y="302.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">0.0023 (our example)</text>
<text x="400.0" y="302.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">2416</text>
<text x="600.0" y="302.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">12</text>
<text x="800.0" y="302.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">-0.041 %</text>
<text x="80.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">0.001</text>
<text x="400.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">1048</text>
<text x="600.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">11</text>
<text x="800.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">-0.055 %</text>
<text x="80.0" y="350.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#db2777" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">0.0001</text>
<text x="400.0" y="350.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#db2777" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">104</text>
<text x="600.0" y="350.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#db2777" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">7</text>
<text x="800.0" y="350.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#db2777" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">-0.818 %</text>
<rect x="20.0" y="390.0" width="1060.0" height="190.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="416.0" r="13" fill="#111827"/>
<text x="46.0" y="420.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="421.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Why does alpha * acc fit in int32?</text>
<text x="68.0" y="440.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">alpha * acc is about (acc * M) * 2^20: the output with 20 fraction bits. It overflows only past 2048.</text>
<rect x="60.0" y="486.0" width="30.6" height="40.0" rx="3" fill="#e5e7eb" fill-opacity="1.0" stroke="#9ca3af" stroke-width="1.3"/>
<text x="75.3" y="478.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9ca3af" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1 bit</text>
<text x="75.3" y="550.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9ca3af" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">sign</text>
<rect x="90.6" y="486.0" width="122.5" height="40.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.3"/>
<text x="151.9" y="478.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">4 bits</text>
<text x="151.9" y="550.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">spare</text>
<rect x="213.1" y="486.0" width="214.4" height="40.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="320.3" y="478.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">7 bits</text>
<text x="320.3" y="550.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">int8 magnitude</text>
<rect x="427.5" y="486.0" width="612.5" height="40.0" rx="3" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="733.8" y="478.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">20 bits</text>
<text x="733.8" y="550.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">fraction (shifted out)</text>
<text x="30.0" y="611.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="600.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="118.3" y="611.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">output bits</text>
<rect x="208.8" y="600.0" width="14.0" height="14.0" rx="3" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="229.8" y="611.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">fraction bits</text>
<rect x="330.2" y="600.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="351.2" y="611.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">spare bits</text>
<rect x="435.3" y="600.0" width="14.0" height="14.0" rx="3" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.4"/>
<text x="456.3" y="611.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">large alpha error</text>
<text x="30.0" y="640.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Overflow happens only when |acc * M| &gt; 2^31 / 2^20 = 2048, 16x beyond the int8 range (128) before clipping.</text>
<text x="30.0" y="658.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Elementwise ops have M near 1 but tiny inputs (|q - zp| &lt;= 255), so they fit too.</text>
</svg>
